<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="510" viewBox="0 0 1280 510" role="img" aria-labelledby="title desc">
<title id="title">Integrated evidence chain</title><desc id="desc">Foundation task adaptation, broad closed-loop transfer, and supervisor mechanism evidence.</desc>
<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #202124; }
.title { font-size: 18px; font-weight: 600; }
.subtitle { font-size: 11.5px; fill: #5F6368; }
.panel-title { font-size: 13px; font-weight: 600; }
.label { font-size: 11px; } .small { font-size: 9.5px; }
.axis { stroke: #202124; stroke-width: 1.1; }
.grid { stroke: #D9D9D9; stroke-width: .8; }
.panel { fill: #FFFFFF; stroke: none; }
</style><rect width="100%" height="100%" fill="#FFFFFF"/><text class="title" x="48" y="39">Prediction gain, closed-loop transfer and supervisory mechanism</text>
<text class="subtitle" x="48" y="61">Panels retain their own estimands and scales; no cross-experiment pooling is applied.</text>
