<text x="73.00" y="352.00" class="small" text-anchor="start">Evidence gate</text>
<text x="73.00" y="376.00" class="label" text-anchor="start">
<tspan x="73.00" dy="0">Negative/mixed pilot</tspan>
</text>
<line x1="305.00" y1="275.00" x2="327.00" y2="275.00" stroke="#5B6773" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="335.00" y="150.00" width="245.00" height="250.00" rx="14" fill="#FFFFFF" stroke="#17845B" stroke-width="2"/>
<rect x="335.00" y="150.00" width="245.00" height="47.00" rx="14" fill="#17845B" stroke="#17845B" stroke-width="0"/>
<text x="351.00" y="181.00" class="panel" text-anchor="start" fill="#FFFFFF">2  Controlled interaction data</text>
<text x="353.00" y="235.00" class="label" text-anchor="start">
<tspan x="353.00" dy="0">200 CARLA rollouts;</tspan>
<tspan x="353.00" dy="22">rollout-level</tspan>
<tspan x="353.00" dy="22">train/val/test split</tspan>
</text>
<line x1="353.00" y1="325.00" x2="562.00" y2="325.00" stroke="#D7DEE5" stroke-width="1"/>
<text x="353.00" y="352.00" class="small" text-anchor="start">Evidence gate</text>
<text x="353.00" y="376.00" class="label" text-anchor="start">
<tspan x="353.00" dy="0">Integrity + collision</tspan>
<tspan x="353.00" dy="20">audit</tspan>
</text>
<line x1="585.00" y1="275.00" x2="607.00" y2="275.00" stroke="#5B6773" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="615.00" y="150.00" width="245.00" height="250.00" rx="14" fill="#FFFFFF" stroke="#2474B5" stroke-width="2"/>
<rect x="615.00" y="150.00" width="245.00" height="47.00" rx="14" fill="#2474B5" stroke="#2474B5" stroke-width="0"/>
<text x="631.00" y="181.00" class="panel" text-anchor="start" fill="#FFFFFF">3  Matched model comparison</text>
<text x="633.00" y="235.00" class="label" text-anchor="start">
<tspan x="633.00" dy="0">B0, B1, B2-M, B2-D, T1 and</tspan>
<tspan x="633.00" dy="22">T2; 3 seeds</tspan>
</text>
<line x1="633.00" y1="325.00" x2="842.00" y2="325.00" stroke="#D7DEE5" stroke-width="1"/>
<text x="633.00" y="352.00" class="small" text-anchor="start">Evidence gate</text>
<text x="633.00" y="376.00" class="label" text-anchor="start">
<tspan x="633.00" dy="0">Validation-only selection</tspan>
</text>
<line x1="865.00" y1="275.00" x2="887.00" y2="275.00" stroke="#5B6773" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="895.00" y="150.00" width="245.00" height="250.00" rx="14" fill="#FFFFFF" stroke="#8A55A3" stroke-width="2"/>
