<text x="911.00" y="181.00" class="panel" text-anchor="start" fill="#FFFFFF">4  Frozen closed loop</text>
<text x="913.00" y="235.00" class="label" text-anchor="start">
<tspan x="913.00" dy="0">Predictor × risk × style ×</tspan>
<tspan x="913.00" dy="22">timing</tspan>
</text>
<line x1="913.00" y1="325.00" x2="1122.00" y2="325.00" stroke="#D7DEE5" stroke-width="1"/>
<text x="913.00" y="352.00" class="small" text-anchor="start">Evidence gate</text>
<text x="913.00" y="376.00" class="label" text-anchor="start">
<tspan x="913.00" dy="0">120 formal rollouts</tspan>
</text>
<rect x="130.00" y="485.00" width="940.00" height="125.00" rx="12" fill="#F3F6F8" stroke="#D7DEE5" stroke-width="1.2"/>
<text x="155.00" y="518.00" class="panel" text-anchor="start">Final evidence-led claim</text>
<text x="155.00" y="550.00" class="label" text-anchor="start">
<tspan x="155.00" dy="0">Task adaptation strongly improves in-distribution prediction, but closed-loop benefit is conditional on risk policy,</tspan>
<tspan x="155.00" dy="22">arrival timing, controller acceptance and supervisor intervention. Tested Transformers use sequence context but do not</tspan>
<tspan x="155.00" dy="22">beat simple B1 adaptation.</tspan>
</text>
<text x="600.00" y="665.00" class="small" text-anchor="middle">Primary evidence: Day8 frozen test + Day10 nominal + Day11/12 timing synthesis | Day13 is sensitivity only</text>
</svg>
