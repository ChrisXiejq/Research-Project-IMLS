.label { font-size: 13px; }
.small { font-size: 12px; }
.title { font-size: 17px; font-weight: 600; }
.mlp { stroke: #c2410c; fill: #c2410c; }
.transformer { stroke: #0369a1; fill: #0369a1; }
.neutral { stroke: #4b5563; fill: #4b5563; }
.series-line { fill: none; }
</style>
