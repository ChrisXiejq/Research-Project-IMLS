<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
<title id="title">History horizon and encoder comparison</title>
<desc id="desc">Both encoders improve by 0.4 seconds. Transformer remains better at every horizon, while its history gain is not larger than the MLP history gain.</desc>
