<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
<title id="title">Transformer capacity curve</title>
<desc id="desc">Small-to-large improvement is small and non-monotonic because the medium model has the lowest mean NLL.</desc>
<style>
text { font-family: Helvetica, Arial, sans-serif; fill: #1f2937; }
.axis { stroke: #374151; stroke-width: 1.2; }
.grid { stroke: #d1d5db; stroke-width: 0.8; }
.label { font-size: 13px; }
.small { font-size: 12px; }
.title { font-size: 17px; font-weight: 600; }
.mlp { stroke: #c2410c; fill: #c2410c; }
.transformer { stroke: #0369a1; fill: #0369a1; }
.neutral { stroke: #4b5563; fill: #4b5563; }
.series-line { fill: none; }
</style>
<text class="title" x="380" y="28" text-anchor="middle">Transformer capacity at 1.0 s history</text>
<line class="axis" x1="92" y1="365" x2="720" y2="365"/>
<line class="axis" x1="92" y1="55" x2="92" y2="365"/>
<polyline class="transformer series-line" stroke-width="2" points="122.4,163.3 334.1,235.5 673.1,184.6"/>
<line class="grid" x1="92" y1="365.0" x2="720" y2="365.0"/>
<text class="small" x="82" y="369.0" text-anchor="end">3.9128</text>
<line class="grid" x1="92" y1="287.5" x2="720" y2="287.5"/>
<text class="small" x="82" y="291.5" text-anchor="end">3.9143</text>
<line class="grid" x1="92" y1="210.0" x2="720" y2="210.0"/>
<text class="small" x="82" y="214.0" text-anchor="end">3.9158</text>
<line class="grid" x1="92" y1="132.5" x2="720" y2="132.5"/>
<text class="small" x="82" y="136.5" text-anchor="end">3.9173</text>
<line class="grid" x1="92" y1="55.0" x2="720" y2="55.0"/>
<text class="small" x="82" y="59.0" text-anchor="end">3.9188</text>
<line class="transformer" x1="122.4" y1="241.6" x2="122.4" y2="85.0"/>
<line class="transformer" x1="117.4" y1="241.6" x2="127.4" y2="241.6"/>
<line class="transformer" x1="117.4" y1="85.0" x2="127.4" y2="85.0"/>
<circle class="transformer" cx="122.4" cy="163.3" r="5"/>
<text class="small" x="122.4" y="150.3" text-anchor="middle">Small: 3.9168</text>
<text class="small" x="122.4" y="387" text-anchor="middle">0.167M</text>
<line class="transformer" x1="334.1" y1="335.0" x2="334.1" y2="135.9"/>
<line class="transformer" x1="329.1" y1="335.0" x2="339.1" y2="335.0"/>
<line class="transformer" x1="329.1" y1="135.9" x2="339.1" y2="135.9"/>
<circle class="transformer" cx="334.1" cy="235.5" r="5"/>
<text class="small" x="334.1" y="222.5" text-anchor="middle">Medium: 3.9154</text>
<text class="small" x="334.1" y="387" text-anchor="middle">0.498M</text>
<line class="transformer" x1="673.1" y1="225.0" x2="673.1" y2="144.2"/>
<line class="transformer" x1="668.1" y1="225.0" x2="678.1" y2="225.0"/>
<line class="transformer" x1="668.1" y1="144.2" x2="678.1" y2="144.2"/>
<circle class="transformer" cx="673.1" cy="184.6" r="5"/>
<text class="small" x="673.1" y="171.6" text-anchor="middle">Large: 3.9163</text>
<text class="small" x="673.1" y="387" text-anchor="middle">1.027M</text>
<text class="label" x="406.0" y="415" text-anchor="middle">Trainable parameters</text>
<text class="label" transform="translate(24 210) rotate(-90)" text-anchor="middle">Retrospective held-out rollout-macro NLL (lower is better)</text>
<text class="small" x="720" y="392" text-anchor="end">Error bars: seed SD; 5 independent groups</text>
</svg>
