<svg xmlns="http://www.w3.org/2000/svg" width="840" height="440" viewBox="0 0 840 440" role="img" aria-labelledby="title desc">
<title id="title">Closed-loop model-by-risk contrasts</title>
<desc id="desc">Intervals for completion time, minimum separation, and their model-by-risk interactions cross zero.</desc>
<style>
text { font-family: Helvetica, Arial, sans-serif; fill: #1f2937; }
.axis { stroke: #374151; stroke-width: 1.2; }
.grid { stroke: #d1d5db; stroke-width: 0.8; }
.label { font-size: 13px; }
.small { font-size: 12px; }
.title { font-size: 17px; font-weight: 600; }
.mlp { stroke: #c2410c; fill: #c2410c; }
.transformer { stroke: #0369a1; fill: #0369a1; }
.neutral { stroke: #4b5563; fill: #4b5563; }
.series-line { fill: none; }
</style>
<text class="title" x="420" y="27" text-anchor="middle">P* versus B1 within risk and model-by-risk interaction</text>
<text class="label" x="249.5" y="54" text-anchor="middle">Completion time (s)</text>
<line class="grid" x1="286.6" y1="78" x2="286.6" y2="330" stroke-width="1.5"/>
<line class="axis" x1="92.0" y1="330" x2="92.0" y2="335"/>
<text class="small" x="92.0" y="351" text-anchor="middle">-1.05</text>
<line class="axis" x1="170.8" y1="330" x2="170.8" y2="335"/>
<text class="small" x="170.8" y="351" text-anchor="middle">-0.62</text>
<line class="axis" x1="249.5" y1="330" x2="249.5" y2="335"/>
<text class="small" x="249.5" y="351" text-anchor="middle">-0.20</text>
<line class="axis" x1="328.2" y1="330" x2="328.2" y2="335"/>
<text class="small" x="328.2" y="351" text-anchor="middle">0.23</text>
<line class="axis" x1="407.0" y1="330" x2="407.0" y2="335"/>
<text class="small" x="407.0" y="351" text-anchor="middle">0.65</text>
<text class="small" x="84" y="124" text-anchor="end">Fixed medium</text>
<line class="neutral" x1="218.0" y1="120" x2="393.1" y2="120" stroke-width="2"/>
<line class="neutral" x1="218.0" y1="115" x2="218.0" y2="125"/>
<line class="neutral" x1="393.1" y1="115" x2="393.1" y2="125"/>
<circle class="neutral" cx="303.7" cy="120" r="5"/>
<text class="small" x="303.7" y="109" text-anchor="middle">+0.093</text>
<text class="small" x="84" y="206" text-anchor="end">Adaptive</text>
<line class="neutral" x1="150.4" y1="202" x2="351.4" y2="202" stroke-width="2"/>
<line class="neutral" x1="150.4" y1="197" x2="150.4" y2="207"/>
<line class="neutral" x1="351.4" y1="197" x2="351.4" y2="207"/>
<circle class="neutral" cx="245.8" cy="202" r="5"/>
<text class="small" x="245.8" y="191" text-anchor="middle">-0.220</text>
<text class="small" x="84" y="288" text-anchor="end">Interaction</text>
<line class="neutral" x1="102.7" y1="284" x2="363.0" y2="284" stroke-width="2"/>
<line class="neutral" x1="102.7" y1="279" x2="102.7" y2="289"/>
<line class="neutral" x1="363.0" y1="279" x2="363.0" y2="289"/>
<circle class="neutral" cx="228.7" cy="284" r="5"/>
<text class="small" x="228.7" y="273" text-anchor="middle">-0.313</text>
<line class="axis" x1="92" y1="330" x2="407" y2="330"/>
<text class="label" x="654.5" y="54" text-anchor="middle">Minimum separation (m)</text>
<line class="grid" x1="610.4" y1="78" x2="610.4" y2="330" stroke-width="1.5"/>
<line class="axis" x1="497.0" y1="330" x2="497.0" y2="335"/>
<text class="small" x="497.0" y="351" text-anchor="middle">-0.04</text>
<line class="axis" x1="575.8" y1="330" x2="575.8" y2="335"/>
<text class="small" x="575.8" y="351" text-anchor="middle">-0.01</text>
<line class="axis" x1="654.5" y1="330" x2="654.5" y2="335"/>
<text class="small" x="654.5" y="351" text-anchor="middle">0.02</text>
<line class="axis" x1="733.2" y1="330" x2="733.2" y2="335"/>
<text class="small" x="733.2" y="351" text-anchor="middle">0.05</text>
<line class="axis" x1="812.0" y1="330" x2="812.0" y2="335"/>
<text class="small" x="812.0" y="351" text-anchor="middle">0.08</text>
<text class="small" x="489" y="124" text-anchor="end">Fixed medium</text>
<line class="neutral" x1="531.7" y1="120" x2="626.0" y2="120" stroke-width="2"/>
<line class="neutral" x1="531.7" y1="115" x2="531.7" y2="125"/>
<line class="neutral" x1="626.0" y1="115" x2="626.0" y2="125"/>
<circle class="neutral" cx="583.3" cy="120" r="5"/>
<text class="small" x="583.3" y="109" text-anchor="middle">-0.011</text>
<text class="small" x="489" y="206" text-anchor="end">Adaptive</text>
<line class="neutral" x1="574.3" y1="202" x2="766.0" y2="202" stroke-width="2"/>
<line class="neutral" x1="574.3" y1="197" x2="574.3" y2="207"/>
<line class="neutral" x1="766.0" y1="197" x2="766.0" y2="207"/>
<circle class="neutral" cx="650.9" cy="202" r="5"/>
<text class="small" x="650.9" y="191" text-anchor="middle">+0.016</text>
<text class="small" x="489" y="288" text-anchor="end">Interaction</text>
<line class="neutral" x1="593.0" y1="284" x2="779.2" y2="284" stroke-width="2"/>
<line class="neutral" x1="593.0" y1="279" x2="593.0" y2="289"/>
<line class="neutral" x1="779.2" y1="279" x2="779.2" y2="289"/>
<circle class="neutral" cx="678.0" cy="284" r="5"/>
<text class="small" x="678.0" y="273" text-anchor="middle">+0.027</text>
<line class="axis" x1="497" y1="330" x2="812" y2="330"/>
<text class="small" x="420" y="410" text-anchor="middle">Effects are P* minus B1; interaction is adaptive minus fixed-medium. Bars are paired-group 95% cluster intervals (10 groups).</text>
</svg>
