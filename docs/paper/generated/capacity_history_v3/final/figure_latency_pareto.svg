<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" role="img" aria-labelledby="title desc">
<title id="title">Accuracy latency Pareto plot</title>
<desc id="desc">Nine model cells plotted by warmed batch-one mean latency and retrospective held-out NLL; larger markers identify the bounded Pareto frontier.</desc>
<style>
text { font-family: Helvetica, Arial, sans-serif; fill: #1f2937; }
.axis { stroke: #374151; stroke-width: 1.2; }
.grid { stroke: #d1d5db; stroke-width: 0.8; }
.label { font-size: 13px; }
.small { font-size: 12px; }
.title { font-size: 17px; font-weight: 600; }
.mlp { stroke: #c2410c; fill: #c2410c; }
.transformer { stroke: #0369a1; fill: #0369a1; }
.neutral { stroke: #4b5563; fill: #4b5563; }
.series-line { fill: none; }
</style>
<text class="title" x="410" y="28" text-anchor="middle">Accuracy-latency trade-off</text>
<line class="axis" x1="88" y1="390" x2="775" y2="390"/>
<line class="axis" x1="88" y1="55" x2="88" y2="390"/>
<text class="small" x="88.0" y="412" text-anchor="middle">36.1</text>
<line class="grid" x1="88" y1="390.0" x2="775" y2="390.0"/>
<text class="small" x="79" y="394.0" text-anchor="end">3.913</text>
<text class="small" x="259.8" y="412" text-anchor="middle">38.8</text>
<line class="grid" x1="88" y1="306.2" x2="775" y2="306.2"/>
<text class="small" x="79" y="310.2" text-anchor="end">3.921</text>
<text class="small" x="431.5" y="412" text-anchor="middle">41.5</text>
<line class="grid" x1="88" y1="222.5" x2="775" y2="222.5"/>
<text class="small" x="79" y="226.5" text-anchor="end">3.929</text>
<text class="small" x="603.2" y="412" text-anchor="middle">44.2</text>
<line class="grid" x1="88" y1="138.8" x2="775" y2="138.8"/>
<text class="small" x="79" y="142.8" text-anchor="end">3.938</text>
<text class="small" x="775.0" y="412" text-anchor="middle">46.9</text>
<line class="grid" x1="88" y1="55.0" x2="775" y2="55.0"/>
<text class="small" x="79" y="59.0" text-anchor="end">3.946</text>
<circle class="mlp" cx="151.7" cy="285.3" r="7" fill-opacity="1.0"/>
<text class="small" x="159.7" y="277.3" text-anchor="start">M-h1p0-large</text>
<circle class="mlp" cx="303.4" cy="282.6" r="4" fill-opacity="0.55"/>
<text class="small" x="311.4" y="274.6" text-anchor="start">M-h0p4-large</text>
<circle class="transformer" cx="347.2" cy="348.1" r="7" fill-opacity="1.0"/>
<text class="small" x="355.2" y="338.1" text-anchor="start">T-h1p0-small</text>
<circle class="transformer" cx="428.8" cy="362.1" r="7" fill-opacity="1.0"/>
<text class="small" x="436.8" y="380.1" text-anchor="start">T-h1p0-medium</text>
<circle class="transformer" cx="436.5" cy="315.1" r="4" fill-opacity="0.55"/>
<text class="small" x="444.5" y="307.1" text-anchor="start">T-h0p0-large</text>
<circle class="mlp" cx="438.6" cy="245.1" r="4" fill-opacity="0.55"/>
<text class="small" x="446.6" y="237.1" text-anchor="start">M-h0p0-large</text>
<circle class="neutral" cx="508.7" cy="82.9" r="4" fill-opacity="0.55"/>
<text class="small" x="516.7" y="72.9" text-anchor="start">B1</text>
<circle class="transformer" cx="697.0" cy="357.4" r="4" fill-opacity="0.55"/>
<text class="small" x="689.0" y="345.4" text-anchor="end">T-h0p4-large</text>
<circle class="transformer" cx="711.3" cy="352.3" r="4" fill-opacity="0.55"/>
<text class="small" x="703.3" y="370.3" text-anchor="end">T-h1p0-large</text>
<text class="label" x="431.5" y="448" text-anchor="middle">Warmed batch-one mean latency (ms; lower is better)</text>
<text class="label" transform="translate(22 225) rotate(-90)" text-anchor="middle">Retrospective held-out NLL (lower is better)</text>
<text class="small" x="775" y="420" text-anchor="end">Larger markers are nondominated within the nine-cell study</text>
</svg>
